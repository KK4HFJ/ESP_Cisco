name: Compile

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "ESP Telnet" "LiquidCrystal I2C"

      - name: Use placeholder credentials
        run: cp esp32_telnet/secrets.example.h esp32_telnet/secrets.h

      - name: Compile
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --warnings default esp32_telnet
